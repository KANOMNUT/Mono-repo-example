spring.application.name=demo
server.port=8080

# File upload limits with security restrictions
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# Server Security Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=15m

# TLS Configuration
server.ssl.enabled=false
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# Rate Limiting

# JWT Configuration
jwt.secret=your-very-secret-key-should-be-at-least-32-characters-long
jwt.expiration=86400000

# Default Security User
spring.security.user.name=admin
spring.security.user.password=password
spring.security.filter.order=-100
server.tomcat.max-connections=200
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5s

# XSS Protection
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Logging Security Events
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.FilterChainProxy=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Prevent information disclosure
server.error.include-stacktrace=never
server.error.include-message=never

# JWT Configuration
jwt.secret=your_jwt_secret_key_here_it_should_be_at_least_256_bits_long
jwt.expiration-ms=86400000
jwt.issuer=demo-app

# Default user (for testing only, in production use a proper user management system)
spring.security.user.name=admin
# Password is "P@ssw0rd"
spring.security.user.password=P@ssw0rd

